name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.repository == 'module-federation/nuxt'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # GitHub suppresses push, pull_request, and release events created with
      # GITHUB_TOKEN. workflow_dispatch is the exception, so this job dispatches
      # CI for the release PR and the Release workflow for a new release.
      actions: write
    steps:
      - name: Create release pull request or GitHub release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Run CI on the release pull request
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          RELEASE_BRANCH="$(node -p 'JSON.parse(process.env.PR_JSON).headBranchName')"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"
          gh workflow run e2e-test.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"

      - name: Publish the release to npm
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version=latest \
            -f branch=main \
            -f tag="$TAG_NAME"

      - name: Post summary
        if: always()
        continue-on-error: true
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          echo "## release-please" > "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RELEASE_CREATED" = "true" ]; then
            echo "Created GitHub release \`$TAG_NAME\` and dispatched the \`Release\` workflow to publish it to npm." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$PR_JSON" ]; then
            PR_NUMBER="$(node -p 'JSON.parse(process.env.PR_JSON).number' 2>/dev/null || true)"
            echo "Release pull request #${PR_NUMBER:-?} is open or updated, and CI was dispatched on its branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No releasable changes since the last release." >> "$GITHUB_STEP_SUMMARY"
          fi
